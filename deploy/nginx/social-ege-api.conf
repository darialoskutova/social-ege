# Include this file inside the currently active Nginx `server {}` block.
# It changes only /api/ and leaves the existing root page untouched.

location = /api/health {
    proxy_pass http://127.0.0.1:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_hide_header X-Powered-By;
    add_header Cache-Control "no-store" always;
}

# Future API routes keep their /api/... path when proxied. The exact health
# location above is a compatibility bridge for the current backend /health.
location /api/ {
    # Raw homework/mock uploads are limited again by the backend to exactly
    # 15 MiB. This prevents Nginx's 1 MiB default from rejecting valid files.
    client_max_body_size 15m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_hide_header X-Powered-By;
    add_header Cache-Control "no-store" always;
}
